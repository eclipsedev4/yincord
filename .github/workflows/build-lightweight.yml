name: Build lightweight Yincord
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-desktop
          run-id: '42139487122'
          github-token: ${{ github.token }}
          path: compiled
      - name: Prepare compressed interface and WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4314.35/microsoft.web.webview2.1.0.4314.35.nupkg -OutFile sdk.zip
          Expand-Archive sdk.zip sdk
          Copy-Item LICENSE compiled/renderer/LICENSE
          Push-Location compiled/renderer
          7z a -tzip -mx=9 ../../renderer.zip . '-xr!*.map'
          if ($LASTEXITCODE -ne 0) { throw 'Renderer compression failed' }
          Pop-Location
          Add-Type -AssemblyName System.Drawing
          $bitmap = [Drawing.Bitmap]::FromFile((Join-Path $PWD 'assets/icon.png'))
          $icon = [Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $file = [IO.File]::Create((Join-Path $PWD 'yincord.ico'))
          $icon.Save($file)
          $file.Dispose()
          $bitmap.Dispose()
      - name: Compile a single executable with embedded assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $compiler = 'C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $sdkLib = (Get-ChildItem sdk/lib -Directory | Where-Object Name -match '^net4' | Sort-Object Name | Select-Object -First 1).FullName
          if (-not $sdkLib) { throw 'Framework SDK assemblies not found' }
          $core = Join-Path $sdkLib 'Microsoft.Web.WebView2.Core.dll'
          $forms = Join-Path $sdkLib 'Microsoft.Web.WebView2.WinForms.dll'
          $loader = Join-Path $PWD 'sdk/runtimes/win-x64/native/WebView2Loader.dll'
          & $compiler /nologo /target:winexe /platform:x64 /optimize+ /out:release/Yincord.exe /win32icon:yincord.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.IO.Compression.dll /reference:System.Web.Extensions.dll "/reference:$core" "/reference:$forms" '/resource:renderer.zip,renderer.zip' "/resource:$core,Microsoft.Web.WebView2.Core.dll" "/resource:$forms,Microsoft.Web.WebView2.WinForms.dll" "/resource:$loader,WebView2Loader.dll" lightweight/Program.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          $bytes = (Get-Item release/Yincord.exe).Length
          @{ executableBytes=$bytes; maximumBytes=300000000; runtime='Shared Windows WebView2'; expandsInterfaceToDisk=$false } | ConvertTo-Json | Set-Content release/size-report.json
          if ($bytes -gt 300000000) { throw 'App exceeds the 300 MB size limit' }
          Copy-Item LICENSE release/LICENSE
      - name: Test the lightweight app
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path release/Yincord.exe) -ArgumentList '--smoke-test', (Join-Path $PWD 'smoke-results') -PassThru
          if (-not $app.WaitForExit(100000)) { $app.Kill(); throw 'Startup test timed out' }
          if ($app.ExitCode -ne 0) { throw "Startup test failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Yincord-lightweight-diagnostics
          path: |
            smoke-results/*.json
            smoke-results/*.png
            smoke-results/*.txt
            release/size-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: Yincord-V2-lightweight-Windows
          path: release
