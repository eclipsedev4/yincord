name: Build Yincord V2
on:
  workflow_dispatch:
    inputs:
      renderer_run:
        description: Optional previous run with compiled-desktop artifact (packaging-only retry)
        type: string
        default: ''
      renderer_version:
        description: Exact renderer version when reusing an artifact
        type: string
        default: ''
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: yincord-v2
  cancel-in-progress: true
env:
  BUILD_CHANNEL: stable
  BUILD_VERSION: ${{ inputs.renderer_version || format('2026.1103.{0}', github.run_number) }}
  FLUXER_MODULES: '0'
  FLUXER_OFFLINE: '1'
  FLUXER_SKIP_NATIVE: 'true'
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  renderer:
    if: ${{ !inputs.renderer_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream pin
        id: upstream
        run: |
          node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "sha=" + require("./upstream.json").commit + "\n")'
      - uses: actions/checkout@v4
        with:
          repository: fluxerapp/fluxer
          ref: ${{ steps.upstream.outputs.sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm
          npm install --global pnpm@11.27.0
      - name: Apply Yincord customizations
        run: node scripts/apply.mjs source
      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --filter fluxer_app... --filter fluxer_desktop...
      - name: Build desktop and bundled renderer
        working-directory: source/fluxer_desktop
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-desktop
          path: source/fluxer_desktop/dist
          retention-days: 3
          if-no-files-found: error
      - name: Archive corresponding source
        run: tar --exclude=node_modules --exclude=target --exclude=.git --exclude=dist -czf yincord-source.tar.gz source
      - uses: actions/upload-artifact@v4
        with:
          name: Yincord-V2-source
          path: yincord-source.tar.gz
          retention-days: 7
  windows:
    needs: renderer
    if: ${{ !cancelled() && (needs.renderer.result == 'success' || (needs.renderer.result == 'skipped' && inputs.renderer_run && inputs.renderer_version)) }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream pin
        id: upstream
        shell: bash
        run: |
          node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "sha=" + require("./upstream.json").commit + "\n")'
      - uses: actions/checkout@v4
        with:
          repository: fluxerapp/fluxer
          ref: ${{ steps.upstream.outputs.sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.27.0
      - run: node scripts/apply.mjs source
      - name: Install Windows packaging dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --filter fluxer_desktop...
      - name: Select compatible native cache
        id: native-cache
        run: |
          $pin = Get-Content upstream.json | ConvertFrom-Json
          $cache = Get-Content native-cache.json | ConvertFrom-Json
          if ($cache.upstream_commit -eq $pin.commit) {
            "run=$($cache.run_id)" >> $env:GITHUB_OUTPUT
            "artifact=$($cache.artifact_name)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/download-artifact@v4
        if: ${{ steps.native-cache.outputs.run }}
        with:
          name: ${{ steps.native-cache.outputs.artifact }}
          path: native-package
          run-id: ${{ steps.native-cache.outputs.run }}
          github-token: ${{ github.token }}
      - name: Restore verified native modules
        if: ${{ steps.native-cache.outputs.run }}
        run: |
          $exe = Get-ChildItem native-package -Filter *.exe | Select-Object -First 1
          7z x $exe.FullName -onative-outer -y
          if ($LASTEXITCODE -ne 0) { throw 'Native cache extraction failed' }
          $payload = Get-ChildItem native-outer -Recurse -Filter *.7z | Select-Object -First 1
          if (-not $payload) { throw 'Missing native cache payload' }
          7z x $payload.FullName -onative-app -y
          if ($LASTEXITCODE -ne 0) { throw 'Native payload extraction failed' }
          node scripts/restore-native.mjs native-app
      - name: Set up Windows compiler
        if: ${{ !steps.native-cache.outputs.run }}
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: amd64
      - name: Set up Rust for Windows
        if: ${{ !steps.native-cache.outputs.run }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: x86_64-pc-windows-msvc
      - name: Build and verify required Windows native modules
        if: ${{ !steps.native-cache.outputs.run }}
        working-directory: source/fluxer_desktop
        env:
          FLUXER_SKIP_NATIVE: 'false'
        run: node --input-type=module -e "import {buildNativeAddons} from './scripts/build.mjs'; buildNativeAddons();"
      - uses: actions/download-artifact@v4
        with:
          name: compiled-desktop
          path: source/fluxer_desktop/dist
          run-id: ${{ inputs.renderer_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Package Windows portable
        working-directory: source/fluxer_desktop
        run: pnpm exec electron-builder --config yincord-builder.cjs --win portable --x64 --publish never
      - name: Verify Windows app opens the bundled renderer
        working-directory: source/fluxer_desktop
        run: node ../../scripts/smoke-desktop.mjs yincord-release/win-unpacked/Yincord.exe $env:BUILD_VERSION smoke-results
      - name: Retain startup diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Yincord-V2-startup-diagnostics
          path: source/fluxer_desktop/smoke-results
      - name: Retain executable for debugging
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Yincord-V2-unverified-debug-build
          path: source/fluxer_desktop/yincord-release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Yincord-V2-Windows-x64
          path: source/fluxer_desktop/yincord-release/*.exe
          if-no-files-found: error
          retention-days: 7
